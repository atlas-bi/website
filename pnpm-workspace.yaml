packages:
  - "."

# pnpm 11+: allowBuilds replaces neverBuiltDependencies / onlyBuiltDependencies.
# sharp + @parcel/watcher are needed for Eleventy image processing / watch.
# djlint postinstall needs pip — skip (Coolify/Dockerfile use --ignore-scripts).
allowBuilds:
  sharp: true
  "@parcel/watcher": true
  esbuild: true
  djlint: false
